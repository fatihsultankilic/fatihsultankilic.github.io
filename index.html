<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatih Sultan Kilic – Games</title>
<style>
:root{color-scheme:light dark;--bg:#f6f4ef;--fg:#1d1c1a;--muted:#6b675f;--card:#fff;--line:#e4e0d6}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--fg:#f1eee7;--muted:#a39e93;--card:#1e1d1a;--line:#2e2c28}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-size:28px;margin:0 0 4px}p{color:var(--muted);margin:0 0 28px}
a.card{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;text-decoration:none;margin-bottom:12px}
a.card img{width:56px;height:56px;border-radius:12px}
a.card b{display:block}a.card span{color:var(--muted);font-size:14px}
footer{margin-top:32px;color:var(--muted);font-size:14px}footer a{color:inherit}
</style>
</head>
<body>
<main>
<h1>Fatih Sultan Kilic</h1>
<p>Independent mobile games. Support, privacy policy and terms for each game:</p>
<a class="card" href="truckloader/"><img src="truckloader/assets/icon.png" alt=""><div><b>Truck Loader</b><span>Support · Privacy · Terms</span></div></a>
<a class="card" href="relicrecall/"><img src="relicrecall/assets/apple-touch-icon.png" alt=""><div><b>Relic Recall</b><span>Support · Privacy · Terms</span></div></a>
<footer>Contact: <a href="mailto:devfsk202@gmail.com">devfsk202@gmail.com</a></footer>
</main>
</body>
</html>
